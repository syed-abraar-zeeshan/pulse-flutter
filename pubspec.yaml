name: pulse_flutter
description: "A real-time social and chat application built with Flutter, Node.js, MongoDB, and Socket.IO."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  dio: ^5.10.0
  go_router: ^17.3.0
  flutter_secure_storage: ^10.3.1
  cached_network_image: ^3.4.1
  google_fonts: ^8.1.0
  socket_io_client: ^3.1.6
  image_picker: ^1.2.3
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  